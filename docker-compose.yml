# Infra base (postgres + redis):  docker compose up -d
# + mensajería:                   docker compose --profile kafka up -d   (o --profile rabbit)
# + archivos (S3):                docker compose --profile storage up -d
# + trazas/métricas/logs:         docker compose --profile observability up -d
# + la API en contenedor:         docker compose --profile app up -d --build
#
# Los puertos se publican solo en 127.0.0.1 (no quedan expuestos a la red local).
# Variables: se leen de .env si existe (ver .env.example).
name: core-backend

x-defaults: &defaults
  restart: unless-stopped
  networks: [core]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *defaults
    image: postgres:16.14-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-core}
      POSTGRES_USER: ${DB_USERNAME:-core}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-core}
      TZ: UTC
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=8MB
      -c log_min_duration_statement=500
    ports: ["127.0.0.1:${DB_PORT:-5432}:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    <<: *defaults
    image: redis:7.4.6-alpine
    # volatile-lru: solo desaloja claves con TTL (todas las de la app lo tienen)
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    <<: *defaults
    profiles: [kafka]
    image: apache/kafka:3.9.1
    # INTERNAL para contenedores (kafka:29092), EXTERNAL para la app en el host (localhost:9092)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports: ["127.0.0.1:9092:9092"]
    volumes: [kafka_data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  rabbitmq:
    <<: *defaults
    profiles: [rabbit]
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # S3 compatible para desarrollo (credenciales dev/dev en docker/seaweedfs/s3.json); en producción usar AWS S3, R2, etc.
  s3:
    <<: *defaults
    profiles: [storage]
    image: chrislusf/seaweedfs:3.97
    command: server -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json -dir=/data
    ports: ["127.0.0.1:9000:9000"]
    volumes:
      - s3_data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  s3-init:
    profiles: [storage]
    image: amazon/aws-cli:2.27.0
    restart: "no"
    networks: [core]
    depends_on: [s3]
    environment:
      AWS_ACCESS_KEY_ID: dev
      AWS_SECRET_ACCESS_KEY: dev
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "until aws --endpoint-url http://s3:9000 s3 ls >/dev/null 2>&1; do sleep 2; done;
      aws --endpoint-url http://s3:9000 s3 mb s3://${S3_BUCKET:-core} || true"

  # Grafana + Tempo + Loki + Prometheus + OTel Collector (Grafana en :3001 admin/admin, OTLP en :4317/:4318)
  lgtm:
    <<: *defaults
    profiles: [observability]
    image: grafana/otel-lgtm:0.11.0
    ports: ["127.0.0.1:3001:3000", "127.0.0.1:4317:4317", "127.0.0.1:4318:4318"]
    volumes: [lgtm_data:/data]

  app:
    <<: *defaults
    profiles: [app]
    build:
      context: .
      args:
        VERSION: ${APP_VERSION:-dev}
    image: core-backend-spring:${APP_VERSION:-dev}
    env_file:
      - path: .env
        required: false
    # Direcciones internas de la red de compose (sobrescriben las de .env pensadas para el host)
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      RABBITMQ_HOST: rabbitmq
      S3_ENDPOINT: http://s3:9000
      OTLP_TRACING_ENDPOINT: http://lgtm:4318/v1/traces
    ports: ["127.0.0.1:${SERVER_PORT:-8080}:8080"]
    volumes: [app_storage:/app/storage-data]
    stop_grace_period: 40s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy, required: false }
      rabbitmq: { condition: service_healthy, required: false }

networks:
  core:

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  rabbitmq_data:
  s3_data:
  lgtm_data:
  app_storage:
