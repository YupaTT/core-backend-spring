app:
  security:
    jwt:
      secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789-abcdefghijklmnop}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8084}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.core.backend: DEBUG
