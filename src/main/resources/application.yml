spring:
  application:
    name: core-backend-spring
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  main:
    keep-alive: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:core}
    username: ${DB_USERNAME:core}
    password: ${DB_PASSWORD:core}
    hikari:
      pool-name: core-hikari
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 50
        query:
          fail_on_pagination_over_collection_fetch: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      repositories:
        enabled: false
    web:
      pageable:
        max-page-size: 100

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  compression:
    enabled: true
    min-response-size: 1024
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: core-backend-spring
      access-token-ttl: 15m
      refresh-token-ttl: 7d
    login-password-base64: true
    login-max-attempts: 5
    login-lock-duration: 15m
    bootstrap-admin:
      enabled: true
      username: ${ADMIN_USERNAME:admin}
      email: ${ADMIN_EMAIL:admin@core.local}
      password: ${ADMIN_PASSWORD:}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  integrations:
    redis:
      enabled: ${REDIS_ENABLED:false}
      default-ttl: 10m
      ttls:
        parametros: 30m

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    redis:
      enabled: ${app.integrations.redis.enabled}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
