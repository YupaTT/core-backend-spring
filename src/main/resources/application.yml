spring:
  application:
    name: core-backend-spring
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  main:
    keep-alive: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:core}
    username: ${DB_USERNAME:core}
    password: ${DB_PASSWORD:core}
    hikari:
      pool-name: core-hikari
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 50
        query:
          fail_on_pagination_over_collection_fetch: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      repositories:
        enabled: false
    web:
      pageable:
        max-page-size: 100
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: simple

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  compression:
    enabled: true
    min-response-size: 1024
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: core-backend-spring
      access-token-ttl: 15m
      refresh-token-ttl: 7d
    login-password-base64: true
    login-max-attempts: 5
    login-lock-duration: 15m
    bootstrap-admin:
      enabled: true
      username: ${ADMIN_USERNAME:admin}
      email: ${ADMIN_EMAIL:admin@core.local}
      password: ${ADMIN_PASSWORD:}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  integrations:
    redis:
      enabled: ${REDIS_ENABLED:false}
      default-ttl: 10m
      ttls:
        parametros: 30m
    observability:
      tracing-enabled: ${TRACING_ENABLED:false}
    messaging:
      provider: ${MESSAGING_PROVIDER:none}
      topic-prefix: core
      outbox:
        batch-size: 100
        poll-interval: 2s
    http:
      clients: {}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    redis:
      enabled: ${app.integrations.redis.enabled}
    rabbit:
      enabled: ${RABBIT_HEALTH_ENABLED:false}
  tracing:
    enabled: ${app.integrations.observability.tracing-enabled}
    sampling:
      probability: ${TRACING_SAMPLING:0.1}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  observations:
    key-values:
      application: ${spring.application.name}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
  timelimiter:
    configs:
      default:
        timeout-duration: 5s
